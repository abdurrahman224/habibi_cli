server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 1m;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
